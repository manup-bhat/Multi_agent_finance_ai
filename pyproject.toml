[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "multi-agent-india-engine"
version = "0.1.0"
description = "India Multi-Agent AI Financial Prediction Engine"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Private"}

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*", "data*", "features*", "prediction*",
    "sentiment*", "agents*", "fno*", "macro*",
    "backtesting*", "feedback*", "compliance*",
    "risk*", "embeddings*", "api*", "ui*", "tests*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]          # ← THIS LINE is the pytest fix for ModuleNotFoundError
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true